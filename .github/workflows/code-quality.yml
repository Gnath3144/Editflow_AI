name: Code Quality & Linting

on:
  push:
    branches:
      - main
      - chore/**
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Style Verification
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ruff & Static Analyzers
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check core/ editflow/ automation/editorial/ automation/multilingual/ --output-format=github
        continue-on-error: true

      - name: Run Ruff Format Check
        run: |
          ruff format --check .
        continue-on-error: true
