[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "editflow"
version = "1.0.0"
description = "Editflow AI - Central Video Post-Production & Multilingual Automation System"
authors = [{name = "Codealytica Engineering"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "faster-whisper>=1.0.0",
    "av>=10.0.0",
    "soundfile>=0.12.0",
    "webrtcvad>=2.0.10",
    "Resemblyzer>=0.1.4",
    "scipy>=1.10.0",
    "requests>=2.28.0",
    "pillow>=10.0.0",
    "google-api-python-client>=2.0.0"
]

[project.scripts]
editflow = "editflow.cli:main"


[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "automation/youtube",
    "automation/video_processing",
    "tools",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401", "F841", "E402", "W291", "W293"]
